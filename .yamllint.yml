---
extends: default
rules:
  line-length:
    max: 160
    level: warning
    allow-non-breakable-words: true
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
ignore: |
  node_modules/
  docs-site/dist/
  .venv/
