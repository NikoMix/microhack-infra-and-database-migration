StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Microsoft, write-good

Vocab = Microhack

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft

# Relax a few rules that conflict with technical training content
Microsoft.Contractions = NO
Microsoft.FirstPerson = NO
Microsoft.Adverbs = NO
Vale.Spelling = NO

# Spaced em-dashes are our deliberate house style for this training corpus.
Microsoft.Dashes = NO

# Keep the following as non-blocking telemetry (warnings, not errors): the same
# tokens are legitimately cased differently in prose vs. code, paths, resource
# names and URLs (e.g. infra/bicep/, workloads/mysql/, mysql-ttmh-<suffix>,
# iac-architect, the microhack-* repo slug). They surface as annotations but do
# not fail CI, while genuine error-level issues (repetition, spelling) still gate.
Vale.Terms = warning
Microsoft.Auto = warning
Microsoft.Spacing = warning
