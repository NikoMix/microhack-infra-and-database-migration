name: Link Check

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check
        # External links are validated here. Internal Starlight navigation
        # (root-relative routes like /trainer/agenda/) is validated by the
        # Astro build, so local file:// links are excluded. GitHub Actions
        # badge/workflow URLs are excluded because they 404 until the workflow
        # first runs on the default branch.
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --root-dir ${{ github.workspace }}
            --accept 200,206,403,429
            --exclude-path docs-site/dist
            --exclude-path node_modules
            --exclude github\.com/.*/actions/workflows/
            --exclude ^file://
            "**/*.md" "**/*.mdx"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
